{% extends "base.html" %}
{%$ block conteudo %}

<h2>{{ titulo }}</h2>

<form method="post" class="formulario">
    <label>
        Nome
        {% if editando %}
            <input type="text" value="{{ aluno.nome }}" disabled>
        {% else %}
            <input type="text" name="nome" value="{{ aluno.nome if aluno else ''}}" required autofocus>
    </label>
    <label>
        Nota 1 (0 a 10)
        <input type="text" name="nota1" inputmode="decimal" value="{{ aluno.nota1 if aluno else ''}}" required>
    </label>
    <label>
        Nota 2 (0 a 10)
        <input type="text" name="nota2" inputmode="decimal" value="{{ aluno.nota2 if aluno else ''}}" required>
    </label>

    <div>
        <button type="submit">Salvar</button>
        <a href="{{ url_for('inicio') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
